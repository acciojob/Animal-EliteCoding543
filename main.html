<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Photos</title>

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body{
      background: repeating-linear-gradient(
        45deg,
        #111,
        #111 10px,
        #222 10px,
        #222 20px
      );

      font-family: Arial, sans-serif;

      display: flex;

      justify-content: center;

      padding: 30px;
    }

    /* ================= MAIN CONTAINER ================= */

    #animal-photos{
      width: 90%;

      max-width: 1100px;

      background-color: #4a4a4a;

      border-radius: 20px;

      padding: 30px;
    }

    /* ================= HEADING ================= */

    #photo-heading{
      text-align: center;

      color: white;

      font-size: 60px;

      margin-bottom: 30px;

      font-family: Georgia, serif;
    }

    /* ================= IMAGE GRID ================= */

    .gallery{
      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 25px;
    }

    /* ================= IMAGES ================= */

    .gallery img{
      width: 100%;

      height: 230px;

      object-fit: cover;

      border-radius: 20px;

      transition: 0.3s;
    }

    .gallery img:hover{
      transform: scale(1.03);
    }

    /* ================= RESPONSIVE ================= */

    @media(max-width: 768px){

      .gallery{
        grid-template-columns: repeat(2, 1fr);
      }

      #photo-heading{
        font-size: 40px;
      }
    }

    @media(max-width: 500px){

      .gallery{
        grid-template-columns: 1fr;
      }

      #photo-heading{
        font-size: 32px;
      }
    }

  </style>
</head>

<body>

  <!-- ================= MAIN CONTAINER ================= -->

  <div id="animal-photos">

    <!-- ================= HEADING ================= -->

    <h1 id="photo-heading">
      Animal Photos
    </h1>

    <!-- ================= GALLERY ================= -->

    <div class="gallery">

  <img
    src="https://images.unsplash.com/photo-1516715094483-75da7dee9758?q=80&w=800&auto=format&fit=crop"
    alt="camel"
  >

  <img
    src="https://images.unsplash.com/photo-1520808663317-647b476a81b9?q=80&w=800&auto=format&fit=crop"
    alt="cheetah"
  >

  <img
    src="https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?q=80&w=800&auto=format&fit=crop"
    alt="elephant"
  >

  <img
    src="https://images.unsplash.com/photo-1535941339077-2dd1c7963098?q=80&w=800&auto=format&fit=crop"
    alt="gorilla"
  >

  <img
    src="https://images.unsplash.com/photo-1525253086316-d0c936c814f8?q=80&w=800&auto=format&fit=crop"
    alt="koala"
  >

  <img
    src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?q=80&w=800&auto=format&fit=crop"
    alt="lion"
  >

  <img
    src="https://images.unsplash.com/photo-1589656966895-2f33e7653819?q=80&w=800&auto=format&fit=crop"
    alt="polar bear"
  >

  <img
    src="https://images.unsplash.com/photo-1549480017-d76466a4b7e8?q=80&w=800&auto=format&fit=crop"
    alt="tiger"
  >

  <img
    src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?q=80&w=800&auto=format&fit=crop"
    alt="wolf"
  >

</div>

  </div>

</body>
</html>
